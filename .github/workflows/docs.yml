name: docs

# Builds docs.stellarresonance.app (docs-site/, Starlight) and deploys it to Cloudflare Pages.
#   push to main / daily / manual → production (docs.stellarresonance.app)
#   release tag vX.Y.Z            → a frozen snapshot at vX-Y-Z.stellar-docs-bs5.pages.dev, AND production is
#                                   rebuilt from main so its /versions.json (read live by every page's version
#                                   menu, snapshots included) lists the new release immediately
#   pull request                  → a preview deployment (<branch>.stellar-docs-bs5.pages.dev)
# Everything the site shows is regenerated from the repo on every run: guides, API reference (Stellar.Abstractions
# XML docs), wire coverage, plugin gallery (public registry), changelog, versions, interactive diagrams (Archify).
on:
  # No path filter on push: the site reads reader sources (wire coverage), FrameworkVersion.cs and the plugin
  # registry too. Testing-channel tags (vX.Y.Z-rc…) don't match the tag pattern, so they get no snapshot.
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['docs/**', 'docs-site/**', 'src/**', 'CHANGELOG.md', 'CONTRIBUTING.md', '.github/workflows/docs.yml']
  # Daily: picks up plugin-registry releases (the gallery) without waiting for a framework push.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  ARCHIFY_REPO: https://github.com/tt-a1i/archify
  ARCHIFY_COMMIT: 9e35d2b0b39b155553ba9fcfe0b4f2a5198dd993   # 2.17.0-dev.1 — bump deliberately
  XMLDOCMD_VERSION: 2.9.0

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # target = what to build + where it goes: main → production, snapshot → vX-Y-Z alias, preview → PR alias.
        target: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["snapshot","main"]' || github.event_name == 'pull_request' && '["preview"]' || '["main"]') }}
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      DOCS_BUILD_KIND: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a release tag the "main" leg builds main (with the new tag visible), not the tag.
          ref: ${{ matrix.target == 'main' && startsWith(github.ref, 'refs/tags/') && 'main' || '' }}
          fetch-depth: 0   # tags (version menu) + the pinned commit the layer diagram's source links are verified at

      - name: Resolve build identity
        id: id
        run: |
          case "$DOCS_BUILD_KIND" in
            snapshot) echo "DOCS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            preview)  echo "branch=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT" ;;
            *)        echo "branch=main" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install xmldocmd
        run: dotnet tool install -g xmldocmd --version "$XMLDOCMD_VERSION"

      - name: Render interactive diagrams (Archify)
        run: |
          git init -q /tmp/archify && cd /tmp/archify
          git fetch -q --depth 1 "$ARCHIFY_REPO" "$ARCHIFY_COMMIT" && git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          ARCHIFY=/tmp/archify/archify/bin/archify.mjs docs/diagrams/build.sh

      - name: Build site
        working-directory: docs-site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to Cloudflare Pages
        # Fork PRs get no secrets — they still build (above), they just don't deploy.
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/dist --project-name=stellar-docs --branch=${{ steps.id.outputs.branch }} --commit-hash=${{ steps.id.outputs.sha }}
